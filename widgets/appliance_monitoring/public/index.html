<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent;color:#fff}body{padding:10px}.widget{width:100%;height:calc(var(--widget-height,360px) - 20px);min-height:200px;background:linear-gradient(145deg,#172033,#111827);border-radius:22px;padding:16px;box-shadow:0 16px 42px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.title{font-size:19px;font-weight:800;letter-spacing:-.02em}.sync{width:34px;height:34px;border:0;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;padding:0}.current{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:13px;margin-bottom:12px}.label{color:#aeb8c7;font-size:12px;margin-bottom:3px}.mode{font-size:26px;font-weight:850;line-height:1.1}.mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}button.mode-btn{border:0;border-radius:14px;padding:10px 8px;background:#263244;color:#fff;cursor:pointer;font-size:14px;font-weight:650}button.mode-btn.active{background:#fff;color:#111827}button.mode-btn:disabled{opacity:.55;cursor:wait}.section-line{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}.section-title{color:#d5dce8;font-size:13px;font-weight:800}.count{color:#9ca3af;font-size:11px}.devices{flex:1 1 auto;min-height:0;overflow:auto;padding-right:2px}.device{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.05);border-radius:15px;padding:9px 11px;margin-bottom:7px;cursor:pointer}.device-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:650}.meta{color:#9ca3af;font-size:11px;margin-top:2px}.device-left{min-width:0}.state{flex:0 0 auto;font-size:12px;border-radius:999px;padding:4px 8px;font-weight:800}.running{background:rgba(245,158,11,.18);color:#fbbf24}.ready{background:rgba(34,197,94,.18);color:#86efac}.idle,.standby{background:rgba(148,163,184,.18);color:#cbd5e1}.active{background:rgba(245,158,11,.18);color:#fbbf24}.empty,.error{color:#aeb8c7;background:rgba(255,255,255,.06);border-radius:15px;padding:12px;font-size:13px;line-height:1.35}.error{color:#fecaca}:root{--accent:#60a5fa;--accent-soft:rgba(96,165,250,.22);--hero-image:none}.widget{background:linear-gradient(145deg,rgba(23,32,51,.92),rgba(17,24,39,.96)),var(--hero-image),radial-gradient(circle at 20% 0%,var(--accent-soft),transparent 38%),linear-gradient(145deg,#172033,#111827);background-size:cover;background-position:center}.state.ready{background:var(--accent-soft);color:#fff}.current,.mode-buttons{display:none!important;}

</style></head><body><div class="widget"><div class="header"><div class="title">Apparaat monitoring</div><button class="sync" id="refresh" title="Vernieuwen">↻</button></div><div class="current"><div class="label">Huidige modus</div><div class="mode" id="currentMode">...</div></div><div class="mode-buttons" id="modeButtons"></div><div class="section-line"><div class="section-title">Activiteiten & apparaten</div><div class="count" id="deviceCount"></div></div><div class="devices" id="devices"></div></div><div id="detail" style="display:none;position:fixed;inset:10px;z-index:9;background:#0f172a;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.55)"><button id="closeDetail" style="float:right;border:0;border-radius:10px;padding:7px 10px">×</button><div id="detailContent"></div></div>
<script>var api=null,currentMode=null,busy=false,statusTimer=null,configuredHeight=360,SHOW_MODES=false,SHOW_APPLIANCES=true;var WIDGET_LANG=((navigator.language||'nl').toLowerCase().indexOf('en')===0)?'en':'nl';
function detectWidgetLang(Homey){
  var candidates=[];
  try{ if(Homey){ candidates.push(Homey.language, Homey.lang, Homey.locale); } }catch(e){}
  try{ candidates.push(document.documentElement.lang); }catch(e){}
  try{ candidates.push(navigator.language, (navigator.languages&&navigator.languages[0])); }catch(e){}
  for(var i=0;i<candidates.length;i++){
    var v=String(candidates[i]||'').toLowerCase();
    if(v.indexOf('de')===0)return 'de';
    if(v.indexOf('fr')===0)return 'fr';
    if(v.indexOf('es')===0)return 'es';
    if(v.indexOf('en')===0)return 'en';
    if(v.indexOf('nl')===0)return 'nl';
  }
  return 'nl';
}

    'Refresh':'widgets.common.refresh','Vernieuwen':'widgets.common.refresh',
    'Running':'widgets.common.running','Bezig':'widgets.common.running','running':'widgets.common.running','bezig':'widgets.common.running',
    'Ready':'widgets.common.ready','Klaar':'widgets.common.ready','ready':'widgets.common.ready','klaar':'widgets.common.ready',
    'Standby':'widgets.common.standby','Stand-by':'widgets.common.standby',
    'Duration':'widgets.common.duration','Duur':'widgets.common.duration',
    'Appliances':'widgets.common.appliances','Apparaten':'widgets.common.appliances','Activities':'widgets.common.activities','Activiteiten':'widgets.common.activities',
    'No appliances':'widgets.common.no_appliances','Geen apparaten':'widgets.common.no_appliances',
    'No appliances configured.':'widgets.common.no_appliances_configured','Geen apparaten ingesteld.':'widgets.common.no_appliances_configured',
    'Appliance':'widgets.common.appliance','Apparaat':'widgets.common.appliance',
    'Could not load widget data.':'widgets.common.could_not_load_widget_data','Kan widgetdata niet laden.':'widgets.common.could_not_load_widget_data',
    'Could not load status.':'widgets.common.could_not_load_status','Kan status niet laden.':'widgets.common.could_not_load_status',
    'Could not change mode.':'widgets.common.could_not_change_mode','Kan modus niet wijzigen.':'widgets.common.could_not_change_mode',
    'Monitoring':'widgets.common.monitoring',
    'Mode':'widgets.common.mode','Modus':'widgets.common.mode',
    'Appliance monitoring':'widgets.common.appliance_monitoring','Apparaat monitoring':'widgets.common.appliance_monitoring',
    'No sub mode':'widgets.common.no_sub_mode','Geen submodus':'widgets.common.no_sub_mode',
    'Home':'widgets.modes.home','Thuis':'widgets.modes.home',
    'Away':'widgets.modes.away','Afwezig':'widgets.modes.away',
    'Sleep':'widgets.modes.sleep','Slapen':'widgets.modes.sleep',
    'Vacation':'widgets.modes.vacation','Vakantie':'widgets.modes.vacation',
    'Watch TV':'widgets.modes.home_tv','TV kijken':'widgets.modes.home_tv',
    'Watch movie':'widgets.modes.home_movie','Film kijken':'widgets.modes.home_movie',
    'Game':'widgets.modes.home_game',
    'Romantic':'widgets.modes.home_romantic','Romantisch':'widgets.modes.home_romantic'
  };
  var key=keyMap[en]||keyMap[nl];
  try{
    var H=window.Homey;
    if(H&&typeof H.__==='function'&&key){
      var translated=H.__(key);
      if(translated&&translated!==key)return translated;
    }
  }catch(e){}
  var map={nl:nl,en:en,de:de||en,fr:fr||en,es:es||en};
  return map[WIDGET_LANG]||en||nl;
}
function applyWidgetTranslations(){
  var title=document.querySelector('.title');
  if(title){
    if(SHOW_MODES&&SHOW_APPLIANCES)title.textContent=tr('Monitoring','Monitoring','Überwachung','Surveillance','Monitorización');
    else if(SHOW_MODES)title.textContent=tr('Modus','Mode','Modus','Mode','Modo');
    else title.textContent=tr('Apparaat monitoring','Appliance monitoring','Geräteüberwachung','Surveillance des appareils','Monitorización de dispositivos');
  }
  var label=document.querySelector('.current .label');
  if(label)label.textContent=tr('Huidige modus','Current mode','Aktueller Modus','Mode actuel','Modo actual');
  var section=document.querySelector('.section-title');
  if(section)section.textContent=tr('Apparaten','Appliances','Geräte','Appareils','Dispositivos');
  var refresh=document.getElementById('refresh');
  if(refresh)refresh.setAttribute('title',tr('Vernieuwen','Refresh','Aktualisieren','Actualiser','Actualizar'));
}
function clampNumber(v,min,max,f){var n=Number(v);if(!Number.isFinite(n))return f;return Math.max(min,Math.min(max,Math.round(n)))}function readConfiguredHeight(Homey){var s={};try{s=Homey&&typeof Homey.getSettings==='function'?(Homey.getSettings()||{}):{}}catch(e){s={}}return clampNumber(s.widgetHeight,220,900,360)}function applyConfiguredHeight(Homey){configuredHeight=readConfiguredHeight(Homey);document.documentElement.style.setProperty('--widget-height',configuredHeight+'px');if(Homey&&typeof Homey.setHeight==='function')Homey.setHeight(configuredHeight)}function fmt(v,u){var n=Number(v);if(!Number.isFinite(n)||n<=0)return '';return n.toLocaleString(WIDGET_LANG==='nl'?'nl-NL':'en-US',{maximumFractionDigits:3})+' '+u}
function detail(item){var d=document.getElementById('detail'),c=document.getElementById('detailContent');var hist=Array.isArray(item.history)?item.history:[];c.innerHTML='<h2 style="margin:0 0 8px">'+(item.name||'')+'</h2><p>'+statusLabel(item.status)+' · '+runningDurationText(item).replace(/^.*: /,'')+'</p><p>'+[fmt(item.waterUsed,'L'),fmt(item.energyKwh,'kWh'),fmt(item.gasUsed,'m³')].filter(Boolean).join(' · ')+'</p><h3>'+tr('Geschiedenis','History','Verlauf','Historique','Historial')+'</h3>'+(hist.length?hist.map(function(h){return '<div class="device" style="cursor:default"><div><b>'+(h.startTime||'')+'</b><div class="meta">'+(h.duration||'')+' · '+[fmt(h.waterUsed,'L'),fmt(h.energyKwh,'kWh'),fmt(h.gasUsed,'m³')].filter(Boolean).join(' · ')+'</div></div></div>'}).join(''):'<div class="empty">'+tr('Geen historie','No history','Kein Verlauf','Aucun historique','Sin historial')+'</div>');d.style.display='block'}
function formatEnergyKwh(v){var n=Number(v);if(!Number.isFinite(n)||n<=0)return '';return n.toLocaleString(WIDGET_LANG==='nl'?'nl-NL':(WIDGET_LANG==='de'?'de-DE':(WIDGET_LANG==='fr'?'fr-FR':(WIDGET_LANG==='es'?'es-ES':'en-US'))),{minimumFractionDigits:2,maximumFractionDigits:3})+' kWh'}function statusLabel(s){if(s==='active')return tr('Actief','Active','Aktiv','Active','Activa');if(s==='running')return tr('Bezig','Running','Läuft','En cours','En ejecución');if(s==='ready')return tr('Klaar','Ready','Fertig','Prêt','Listo');return tr('Stand-by','Standby','Standby','En veille','En espera')}function runningDurationText(device){if(!device)return '';var ms=(device.status==='standby'&&device.lastSession&&typeof device.lastSession.durationMs==='number')?device.lastSession.durationMs:(device.status==='ready'&&typeof device.finalDurationMs==='number')?device.finalDurationMs:device.durationMs;if((!Number.isFinite(Number(ms))||Number(ms)<=0)&&typeof device.durationSeconds==='number')ms=device.durationSeconds*1000;if((!Number.isFinite(Number(ms))||Number(ms)<=0)&&(device.status==='running'||device.status==='active')){var raw=device.runningSince||device.startedAt||device.startTime||device.since||device.activeSince;if(raw){var t=Date.parse(raw);if(!Number.isNaN(t))ms=Math.max(0,Date.now()-t);}}var n=Number(ms);if(!Number.isFinite(n)||n<=0)return '';var total=Math.max(0,Math.round(n/1000));var h=Math.floor(total/3600);var m=Math.floor((total%3600)/60);var sec=total%60;var text=h>0?(h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')):(m+':'+String(sec).padStart(2,'0'));return tr('Duur','Duration','Dauer','Durée','Duración')+': '+text;}function modeText(m){if(m==='home')return tr('Thuis','Home','Zuhause','Maison','Casa');if(m==='sleep')return tr('Slapen','Sleep','Schlafen','Sommeil','Dormir');if(m==='away')return tr('Afwezig','Away','Abwesend','Absent','Fuera');if(m==='vacation')return tr('Vakantie','Vacation','Urlaub','Vacances','Vacaciones');return m}
function translatedModeLabel(item){
  var id=String((item&&item.id)||'').toLowerCase();
  var raw=String((item&&(item.label||item.title||item.name))||'');
  var key=raw.toLowerCase().trim();
  if(id==='home'||key==='home'||key==='thuis')return tr('Thuis','Home','Zuhause','Maison','Casa');
  if(id==='away'||key==='away'||key==='afwezig')return tr('Afwezig','Away','Abwesend','Absent','Fuera');
  if(id==='sleep'||key==='sleep'||key==='slapen')return tr('Slapen','Sleep','Schlafen','Sommeil','Dormir');
  if(id==='vacation'||key==='vacation'||key==='vakantie')return tr('Vakantie','Vacation','Urlaub','Vacances','Vacaciones');
  if(id==='none'||key==='none'||key==='geen submodus'||key==='no sub mode')return tr('Geen submodus','No sub mode','Kein Untermodus','Aucun sous-mode','Sin submodo');
  if(id.indexOf('home_tv')===0||key==='watch tv'||key==='tv kijken')return tr('TV kijken','Watch TV','Fernsehen','Regarder la TV','Ver TV');
  if(id.indexOf('home_movie')===0||key==='watch movie'||key==='film kijken')return tr('Film kijken','Watch movie','Film ansehen','Regarder un film','Ver película');
  if(id.indexOf('home_game')===0||key==='game'||key==='gamen')return tr('Game','Game','Gaming','Jeu','Juego');
  if(id.indexOf('home_romantic')===0||key==='romantic'||key==='romantisch')return tr('Romantisch','Romantic','Romantisch','Romantique','Romántico');
  return raw||modeText(id);
}
function modeIcon(m){if(m==='home')return '🏠';if(m==='sleep')return '🌙';if(m==='away')return '🚶';if(m==='vacation')return '🏖️';return '•'}function setBusy(b){busy=b;document.querySelectorAll('.mode-btn').forEach(function(btn){btn.disabled=busy})}function showError(m){document.getElementById('devices').innerHTML='<div class="error">'+m+'</div>'}function accentToSoft(hex){var h=String(hex||'').trim();if(/^#[0-9a-f]{6}$/i.test(h)){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return 'rgba('+r+','+g+','+b+',.24)'}return 'rgba(96,165,250,.24)'}
function normalizeSubModes(data,modes){var subModes=Array.isArray(data.subModes)?data.subModes:[];if(!subModes.length){subModes=modes.filter(function(m){return !!m.parentMode})}return subModes.map(function(s){return {id:s.id,label:s.label||s.title||s.name||s.id,parentMode:s.parentMode||s.parent||s.mainMode||'home',icon:s.icon||'',accentColor:s.accentColor||s.color||s.accent||'#60a5fa',imageUrl:s.imageUrl||s.backgroundImage||s.image||''}}).filter(function(s){return !!s.id})}
function findParentMode(current,subModes){var sub=subModes.find(function(s){return s.id===current});return sub&&sub.parentMode?sub.parentMode:current}
function applyWidgetTheme(data,parentMode,currentMode,subModes){var active=(subModes||[]).find(function(s){return s.id===currentMode})||{};var accent=(active&&typeof active.accentColor==='string'&&active.accentColor)||'#60a5fa';var img=(active&&typeof active.imageUrl==='string'&&active.imageUrl)||'';document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--accent-soft',accentToSoft(accent));document.documentElement.style.setProperty('--hero-image',img?'url("'+String(img).replace(/"/g,'%22')+'")':'none')}function render(data){if(!data||typeof data!=='object'||Array.isArray(data)){showError(tr('Kan widgetdata niet laden.','Could not load widget data.','Widget-Daten konnten nicht geladen werden.','Impossible de charger les données du widget.','No se pudieron cargar los datos del widget.'));return}var modes=Array.isArray(data.modes)?data.modes:[];var subModes=normalizeSubModes(data,modes);currentMode=data.currentMode||'home';var parentMode=findParentMode(currentMode,subModes);var allModes=modes.concat(subModes);var mode=allModes.find(function(i){return i.id===currentMode})||modes.find(function(i){return i.id===parentMode});document.getElementById('currentMode').textContent=mode?mode.label:modeText(currentMode);var buttons=document.getElementById('modeButtons');buttons.innerHTML='';if(SHOW_MODES){modes.forEach(function(item){var btn=document.createElement('button');btn.className='mode-btn'+(item.id===currentMode?' active':'');btn.textContent=item.label||modeIcon(item.id);btn.disabled=busy;btn.addEventListener('click',function(){changeMode(item.id)});buttons.appendChild(btn)})}var activities=(Array.isArray(data.activities)?data.activities:[]).map(function(a){a._kind='activity';return a});var devices=activities.concat(Array.isArray(data.appliances)?data.appliances:[]);devices=devices.slice().sort(function(a,b){var order={ready:0,running:1,idle:2};return ((order[a.status]!==undefined?order[a.status]:99)-(order[b.status]!==undefined?order[b.status]:99));});var running=devices.filter(function(i){return i.status==='running'||i.status==='active'}).length;var ready=devices.filter(function(i){return i.status==='ready'}).length;document.getElementById('deviceCount').textContent=devices.length?(running+' '+tr('bezig','running','läuft','en cours','en ejecución')+' · '+ready+' '+tr('klaar','ready','fertig','prêt','listo')):tr('Geen apparaten','No appliances','Keine Geräte','Aucun appareil','Sin dispositivos');var c=document.getElementById('devices');c.innerHTML='';if(!SHOW_APPLIANCES)return;if(!devices.length){c.innerHTML='<div class="empty">'+tr('Geen apparaten ingesteld.','No appliances configured.','Keine Geräte eingerichtet.','Aucun appareil configuré.','No hay dispositivos configurados.')+'</div>';return}devices.forEach(function(device){var row=document.createElement('div');row.className='device';var left=document.createElement('div');var name=document.createElement('div');name.className='device-name';name.textContent=device.name||tr('Apparaat','Appliance','Gerät','Appareil','Dispositivo');left.appendChild(name);var metaParts=[];if(device._kind==='activity'){if(device.trueConditions!==undefined)metaParts.push(device.trueConditions+'/'+device.requiredConditions);['waterUsed','energyKwh','gasUsed'].forEach(function(k){var u=k==='waterUsed'?'L':(k==='gasUsed'?'m³':'kWh');var t=fmt(device[k],u);if(t)metaParts.push(t)})}else if(typeof device.lastPower==='number')metaParts.push(device.lastPower+' W');var energyText=formatEnergyKwh(device.energyKwh);if(energyText)metaParts.push(energyText);var runText=runningDurationText(device);if(runText)metaParts.push(runText);if(metaParts.length){var meta=document.createElement('div');meta.className='meta';meta.textContent=metaParts.join(' · ');left.appendChild(meta)}var state=document.createElement('div');state.className='state '+(device.status==='active'?'active':device.status==='running'?'running':device.status==='ready'?'ready':'idle');state.textContent=statusLabel(device.status);if(device._kind==='activity')row.addEventListener('click',function(){detail(device)});row.appendChild(left);row.appendChild(state);c.appendChild(row)})}
function loadStatus(){if(!api)return;api('GET','/',{}).then(render).catch(function(e){showError(e&&e.message?e.message:tr('Kan status niet laden.','Could not load status.','Status konnte nicht geladen werden.','Impossible de charger l’état.','No se pudo cargar el estado.'))})}function changeMode(mode){if(!api||mode===currentMode||busy)return;setBusy(true);if(window.Homey&&typeof window.Homey.hapticFeedback==='function')window.Homey.hapticFeedback();api('POST','/mode',{mode:mode}).then(render).catch(function(e){showError(e&&e.message?e.message:tr('Kan modus niet wijzigen.','Could not change mode.','Modus konnte nicht geändert werden.','Impossible de modifier le mode.','No se pudo cambiar el modo.'))}).finally(function(){setBusy(false)})}function onHomeyReady(Homey){window.Homey=Homey;WIDGET_LANG=detectWidgetLang(Homey);document.documentElement.lang=WIDGET_LANG;api=Homey.api.bind(Homey);applyWidgetTranslations();applyConfiguredHeight(Homey);document.getElementById('refresh').addEventListener('click',loadStatus);document.getElementById('closeDetail').addEventListener('click',function(){document.getElementById('detail').style.display='none'});Homey.ready({height:configuredHeight});loadStatus();statusTimer=setInterval(loadStatus,10000)}document.addEventListener('DOMContentLoaded',function(){WIDGET_LANG=detectWidgetLang(window.Homey);document.documentElement.lang=WIDGET_LANG;applyWidgetTranslations();});</script></body></html>
