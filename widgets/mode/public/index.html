/* 2.6.30 modern widget layout */
:root{
  --accent:#60a5fa;
  --accent-soft:rgba(96,165,250,.22);
  --hero-image:none;
}
body{padding:8px!important}
.widget{
  position:relative!important;
  background:

  background-size:cover!important;
  background-position:center!important;

  padding:12px!important;

.widget::before{
  content:"";

.widget.weather-bg::after,
.widget.weather-bg::before{
  content:"";

.switch-section{display:none;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.10)}
.switch-section.visible{display:block}
.switch-title{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:rgba(226,232,240,.68);margin-bottom:5px}

.switch-indicator:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;left:2px;top:2px;transition:.15s}
.switch-btn.on{background:var(--accent-soft);border-color:rgba(255,255,255,.18)}
.switch-btn.on .switch-indicator{background:var(--accent)}
.switch-btn.on .switch-indicator:after{transform:translateX(10px)}
.switch-btn:disabled{opacity:.55;cursor:wait}
