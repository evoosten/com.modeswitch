<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root{
      --bg:#f7f8fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --line2:#f0f2f5;
      --accent:#1677ff;
      --accent-soft:#edf5ff;
      --danger:#ef4444;
      --danger-soft:#fff1f2;
      --ok:#22c55e;
      --ok-soft:#ecfdf3;
      --btn:#f3f4f6;
      --shadow:0 6px 18px rgba(15,23,42,.06);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;max-width:100%;overflow-x:hidden}
    body{
      margin:0;
      padding:12px 12px calc(190px + env(safe-area-inset-bottom));
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      font-size:14px;
    }

    .wrap{width:100%;max-width:720px;margin:0 auto}
    .top{padding:2px 2px 8px;text-align:left}
    .title{font-size:21px;font-weight:850;letter-spacing:-.45px;line-height:1.12;margin:0 0 5px}
    .hint{font-size:12.5px;color:var(--muted);line-height:1.35;margin:0;max-width:520px}

    .field-block{margin:8px 0 13px}
    .label{display:block;font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.05em;color:#5f6673;margin:0 0 7px}
    .input-shell{
      display:flex;align-items:center;gap:8px;
      height:42px;padding:0 8px;
      border:1px solid var(--line);border-radius:15px;background:var(--card);
      box-shadow:var(--shadow);
    }
    .input-shell .icon{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:900;flex:0 0 auto}

    input,select{
      width:100%;min-width:0;height:34px;border:1px solid var(--line);border-radius:12px;
      padding:0 10px;background:#fff;color:var(--text);font-size:14px;outline:none;
    }
    .input-shell input{height:34px;border:0;padding:0;background:transparent;border-radius:0;font-size:15px}
    input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,119,255,.10)}
    .input-shell input:focus{box-shadow:none}

    button{
      height:31px;border:0;border-radius:11px;padding:0 10px;font-weight:800;cursor:pointer;
      background:var(--btn);color:#4b5563;white-space:nowrap;font-size:13px;
    }
    .primary{background:var(--accent);color:#fff}
    .link-btn{background:transparent;color:var(--accent);padding:0 2px;font-size:14px;height:28px}
    .ghost{background:var(--btn);color:#4b5563}
    .danger{background:var(--danger-soft);color:var(--danger)}
    .mini{width:28px;min-width:28px;height:28px;padding:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
    .remove{font-size:17px;line-height:1;color:var(--danger)}
    .move{font-size:13px;color:#5d6673}

    .section{margin:14px 0}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 7px;padding:0 1px}
    .section-title{display:flex;align-items:center;gap:8px;min-width:0}
    .section-title h2{font-size:13px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.055em;color:#5f6673;font-weight:900}
    .count{height:22px;min-width:34px;padding:0 7px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#6b7280;font-size:12px;font-weight:850;display:inline-flex;align-items:center;justify-content:center}

    .list-card,.switch-card{
      background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);
      margin:8px 0;overflow:hidden;
    }
    .list-summary{
      display:grid;grid-template-columns:30px minmax(0,1fr) 28px 28px;gap:8px;align-items:center;
      min-height:54px;padding:9px 9px 9px 10px;
    }
    .list-ico{width:30px;height:30px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
    .list-main{min-width:0}
    .list-name-row{display:flex;align-items:center;gap:7px;min-width:0;margin-bottom:3px}
    .list-name-row input{height:29px;border:0;border-radius:8px;background:transparent;padding:0;font-size:15px;font-weight:850;letter-spacing:-.2px;min-width:0}
    .list-name-row input:focus{background:#fff;border:1px solid var(--line);padding:0 8px}
    .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta .active-text{color:var(--accent);font-weight:800}
    .chev{font-size:17px;color:#111827;background:transparent}

    .list-body{display:none;border-top:1px solid var(--line2);padding:5px 10px 10px}
    .list-card.open .list-body{display:block}
    .modes{margin:2px 0 7px}
    .mode-row{
      display:grid;grid-template-columns:26px minmax(0,1fr) 28px 28px 28px 28px;gap:7px;align-items:center;
      min-height:41px;border-bottom:1px solid var(--line2);
    }
    .mode-row:last-child{border-bottom:0}
    .radio{
      width:19px;height:19px;border-radius:999px;border:2px solid #c7cdd6;background:#fff;position:relative;margin-left:2px;
    }
    .radio.active{border-color:var(--accent)}
    .radio.active:after{content:"";position:absolute;inset:3px;border-radius:999px;background:var(--accent)}
    .mode-name{height:31px;border:0;border-radius:8px;background:transparent;padding:0;font-size:14px}
    .mode-name:focus{background:#fff;border:1px solid var(--line);padding:0 8px}
    .add-inline{width:100%;height:32px;margin-top:4px;border-radius:12px;background:transparent;color:var(--accent);border:1px dashed #bfd8ff;font-size:13px}

    .empty{border:1px dashed #cbd5e1;border-radius:14px;padding:13px;text-align:center;color:var(--muted);background:#fff;line-height:1.35;font-size:13px;margin:8px 0}

    .switch-card{padding:0}
    .switch-row{display:grid;grid-template-columns:48px minmax(0,1fr) 28px 28px 28px;gap:8px;align-items:center;min-height:54px;padding:8px 10px;border-bottom:1px solid var(--line2)}
    .switch-row:last-child{border-bottom:0}
    .switch-name{height:31px;border:0;border-radius:8px;background:transparent;padding:0;font-size:14.5px;font-weight:650}
    .switch-name:focus{background:#fff;border:1px solid var(--line);padding:0 8px}
    .toggle{width:42px;height:25px;border-radius:999px;background:#d1d5db;position:relative;border:0;padding:0;transition:.15s;justify-self:start}
    .toggle:before{content:"";position:absolute;width:21px;height:21px;border-radius:999px;background:#fff;top:2px;left:2px;box-shadow:0 1px 3px rgba(0,0,0,.20);transition:.15s}
    .toggle.on{background:var(--ok)}
    .toggle.on:before{transform:translateX(17px)}

    .footer{
      position:fixed;left:0;right:0;bottom:0;z-index:10;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:rgba(247,248,251,.96);border-top:1px solid var(--line);
      display:grid;grid-template-columns:1fr 1fr;gap:9px;backdrop-filter:blur(12px);
    }
    .footer button{height:42px;border-radius:14px;font-size:14px;width:100%}
    .summary{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:26px;color:#5f6673;font-size:12px;font-weight:800}
    .dot{width:8px;height:8px;border-radius:999px;background:var(--ok);display:inline-block}
    .status{min-height:22px;margin:8px 2px 0;font-size:13px}.status.error{color:var(--danger)}.status.ok{color:var(--ok)}
    .wrap{padding-bottom:72px}

    @media(min-width:720px){
      body{padding:18px 18px 120px}.title{font-size:25px}.hint{font-size:13px}.footer{position:static;max-width:720px;margin:18px auto 0;border:0;background:transparent;backdrop-filter:none;display:flex;align-items:center}.footer button{width:auto;min-width:130px}.summary{margin-left:auto;grid-column:auto}.list-summary{grid-template-columns:34px minmax(0,1fr) 30px 30px}.list-ico{width:34px;height:34px}.mini{width:30px;min-width:30px;height:30px}.mode-row{grid-template-columns:28px minmax(0,1fr) 30px 30px 30px 30px}.switch-row{grid-template-columns:54px minmax(0,1fr) 30px 30px 30px}.toggle{width:46px;height:27px}.toggle:before{width:23px;height:23px}.toggle.on:before{transform:translateX(19px)}}
    @media(max-width:370px){
      body{padding-left:9px;padding-right:9px}.footer{padding-left:9px;padding-right:9px}.title{font-size:20px}.hint{font-size:12px}.list-summary{grid-template-columns:28px minmax(0,1fr) 26px 26px;gap:6px}.list-ico{width:28px;height:28px}.mini{width:26px;min-width:26px;height:26px;border-radius:9px}.mode-row{grid-template-columns:24px minmax(0,1fr) 26px 26px 26px 26px;gap:5px}.switch-row{grid-template-columns:44px minmax(0,1fr) 26px 26px 26px;gap:6px;padding-left:8px;padding-right:8px}.toggle{width:39px;height:24px}.toggle:before{width:20px;height:20px}.toggle.on:before{transform:translateX(15px)}button{font-size:12.5px}.footer button{height:40px}.section-title h2{font-size:12px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1 class="title" data-i18n="title">Mode & Switch instellen</h1>
      <p class="hint" data-i18n="subtitle">Maak lijsten met modi en losse aan/uit-knoppen.</p>
    </div>

    <div class="field-block">
      <label class="label" for="deviceName" data-i18n="deviceName">Apparaatnaam</label>
      <div class="input-shell">
        <span class="icon">▣</span>
        <input id="deviceName" placeholder="Mode & Switch">
      </div>
    </div>

    <section class="section">
      <div class="section-head">
        <div class="section-title"><h2 data-i18n="listsTitle">Lijsten en modi</h2><span class="count" id="listsCount">0/10</span></div>
        <button class="link-btn" id="addList" data-i18n="addList">+ Lijst</button>
      </div>
      <div id="lists"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <div class="section-title"><h2 data-i18n="switchesTitle">Aan/uit-knoppen</h2><span class="count" id="switchesCount">0/20</span></div>
        <button class="link-btn" id="addSwitch" data-i18n="addSwitch">+ Knop</button>
      </div>
      <div id="switches"></div>
    </section>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">
    <button class="ghost" id="cancel" data-i18n="cancel">Annuleren</button>
    <button class="primary" id="save" data-i18n="save">Opslaan</button>
    <div class="summary"><span id="counter"></span><span class="dot"></span></div>
  </div>

<script>
(function(){
  const isRepair = true;
  const MAX_LISTS = 10;
  const MAX_SWITCHES = 20;
  const txt = {"nl":{"titlePair":"Mode & Switch instellen","titleRepair":"Mode & Switch aanpassen","subtitle":"Maak lijsten met modi en losse aan/uit-knoppen.","deviceName":"Apparaatnaam","listsTitle":"Lijsten en modi","switchesTitle":"Aan/uit-knoppen","addList":"+ Lijst","addSwitch":"+ Knop","save":"Opslaan","cancel":"Annuleren","listName":"Naam van lijst","modeName":"Naam van modus","switchName":"Naam van aan/uit-knop","active":"Actief","addMode":"+ Hoofdmodus","addSubMode":"+ Submodus","emptyLists":"Nog geen lijsten. Voeg een lijst toe om te starten.","emptyModes":"Nog geen modi in deze lijst.","emptySwitches":"Nog geen aan/uit-knoppen.","on":"Aan","off":"Uit","up":"Omhoog","down":"Omlaag","remove":"Verwijder","saved":"Opgeslagen","nameRequired":"Vul een apparaatnaam in.","invalid":"Controleer de namen. Lege namen zijn niet toegestaan.","maxLists":"Maximaal 10 lijsten.","maxSwitches":"Maximaal 20 aan/uit-knoppen.","modes":"modi","defaultListTitle":"Standaardlijst","defaultListLabel":"Standaardlijst op apparaat","defaultListHint":"Deze lijst wordt als belangrijkste lijst op het apparaat getoond. De lijsten worden automatisch uit dit apparaat opgehaald.","defaultAutomatic":"Automatisch / eerste lijst","subMode":"Submodus","mainMode":"Hoofdmodus","chooseMainMode":"Kies hoofdmodus","noLists":"Voeg eerst een lijst toe","open":"Openen","close":"Sluiten","defaultListName":"Lijst","defaultModeName":"Modus","defaultSubModeName":"Submodus","defaultSwitchName":"Aan/uit"},"en":{"titlePair":"Set up Mode & Switch","titleRepair":"Edit Mode & Switch","subtitle":"Create lists with modes and separate on/off buttons.","deviceName":"Device name","listsTitle":"Lists and modes","switchesTitle":"On/off buttons","addList":"+ List","addSwitch":"+ Button","save":"Save","cancel":"Cancel","listName":"List name","modeName":"Mode name","switchName":"On/off button name","active":"Active","addMode":"+ Main mode","addSubMode":"+ Sub mode","emptyLists":"No lists yet. Add a list to start.","emptyModes":"No modes in this list yet.","emptySwitches":"No on/off buttons yet.","on":"On","off":"Off","up":"Up","down":"Down","remove":"Remove","saved":"Saved","nameRequired":"Enter a device name.","invalid":"Check the names. Empty names are not allowed.","maxLists":"Maximum 10 lists.","maxSwitches":"Maximum 20 on/off buttons.","modes":"modes","defaultListTitle":"Default list","defaultListLabel":"Default list on device","defaultListHint":"This list is shown as the main list on the device. The lists are read from this device automatically.","defaultAutomatic":"Automatic / first list","subMode":"Sub mode","mainMode":"Main mode","chooseMainMode":"Choose main mode","noLists":"Add a list first","open":"Open","close":"Close","defaultListName":"List","defaultModeName":"Mode","defaultSubModeName":"Sub mode","defaultSwitchName":"On/off"},"de":{"titlePair":"Mode & Switch einrichten","titleRepair":"Mode & Switch bearbeiten","subtitle":"Erstelle Listen mit Modi und separate Ein-/Aus-Schaltflächen.","deviceName":"Gerätename","listsTitle":"Listen und Modi","switchesTitle":"Ein-/Aus-Schaltflächen","addList":"+ Liste","addSwitch":"+ Schaltfläche","save":"Speichern","cancel":"Abbrechen","listName":"Name der Liste","modeName":"Name des Modus","switchName":"Name der Ein-/Aus-Schaltfläche","active":"Aktiv","addMode":"+ Hauptmodus","addSubMode":"+ Untermodus","emptyLists":"Noch keine Listen. Füge eine Liste hinzu, um zu beginnen.","emptyModes":"Noch keine Modi in dieser Liste.","emptySwitches":"Noch keine Ein-/Aus-Schaltflächen.","on":"Ein","off":"Aus","up":"Nach oben","down":"Nach unten","remove":"Entfernen","saved":"Gespeichert","nameRequired":"Gib einen Gerätenamen ein.","invalid":"Überprüfe die Namen. Leere Namen sind nicht erlaubt.","maxLists":"Maximal 10 Listen.","maxSwitches":"Maximal 20 Ein-/Aus-Schaltflächen.","modes":"Modi","defaultListTitle":"Standardliste","defaultListLabel":"Standardliste auf dem Gerät","defaultListHint":"Diese Liste wird als Hauptliste auf dem Gerät angezeigt. Die Listen werden automatisch von diesem Gerät geladen.","defaultAutomatic":"Automatisch / erste Liste","subMode":"Untermodus","mainMode":"Hauptmodus","chooseMainMode":"Hauptmodus auswählen","noLists":"Füge zuerst eine Liste hinzu","open":"Öffnen","close":"Schließen","defaultListName":"Liste","defaultModeName":"Modus","defaultSubModeName":"Untermodus","defaultSwitchName":"Ein/Aus"},"fr":{"titlePair":"Configurer Mode & Switch","titleRepair":"Modifier Mode & Switch","subtitle":"Crée des listes avec des modes et des boutons marche/arrêt séparés.","deviceName":"Nom de l’appareil","listsTitle":"Listes et modes","switchesTitle":"Boutons marche/arrêt","addList":"+ Liste","addSwitch":"+ Bouton","save":"Enregistrer","cancel":"Annuler","listName":"Nom de la liste","modeName":"Nom du mode","switchName":"Nom du bouton marche/arrêt","active":"Actif","addMode":"+ Mode principal","addSubMode":"+ Sous-mode","emptyLists":"Aucune liste. Ajoute une liste pour commencer.","emptyModes":"Aucun mode dans cette liste.","emptySwitches":"Aucun bouton marche/arrêt.","on":"Marche","off":"Arrêt","up":"Monter","down":"Descendre","remove":"Supprimer","saved":"Enregistré","nameRequired":"Saisis un nom d’appareil.","invalid":"Vérifie les noms. Les noms vides ne sont pas autorisés.","maxLists":"Maximum 10 listes.","maxSwitches":"Maximum 20 boutons marche/arrêt.","modes":"modes","defaultListTitle":"Liste par défaut","defaultListLabel":"Liste par défaut sur l’appareil","defaultListHint":"Cette liste est affichée comme liste principale sur l’appareil. Les listes sont chargées automatiquement depuis cet appareil.","defaultAutomatic":"Automatique / première liste","subMode":"Sous-mode","mainMode":"Mode principal","chooseMainMode":"Choisir le mode principal","noLists":"Ajoute d’abord une liste","open":"Ouvrir","close":"Fermer","defaultListName":"Liste","defaultModeName":"Mode","defaultSubModeName":"Sous-mode","defaultSwitchName":"Marche/arrêt"},"es":{"titlePair":"Configurar Mode & Switch","titleRepair":"Editar Mode & Switch","subtitle":"Crea listas con modos y botones de encendido/apagado independientes.","deviceName":"Nombre del dispositivo","listsTitle":"Listas y modos","switchesTitle":"Botones de encendido/apagado","addList":"+ Lista","addSwitch":"+ Botón","save":"Guardar","cancel":"Cancelar","listName":"Nombre de la lista","modeName":"Nombre del modo","switchName":"Nombre del botón de encendido/apagado","active":"Activo","addMode":"+ Modo principal","addSubMode":"+ Submodo","emptyLists":"Aún no hay listas. Añade una lista para empezar.","emptyModes":"Aún no hay modos en esta lista.","emptySwitches":"Aún no hay botones de encendido/apagado.","on":"Encendido","off":"Apagado","up":"Subir","down":"Bajar","remove":"Eliminar","saved":"Guardado","nameRequired":"Introduce un nombre de dispositivo.","invalid":"Revisa los nombres. No se permiten nombres vacíos.","maxLists":"Máximo 10 listas.","maxSwitches":"Máximo 20 botones de encendido/apagado.","modes":"modos","defaultListTitle":"Lista predeterminada","defaultListLabel":"Lista predeterminada en el dispositivo","defaultListHint":"Esta lista se muestra como lista principal en el dispositivo. Las listas se cargan automáticamente desde este dispositivo.","defaultAutomatic":"Automático / primera lista","subMode":"Submodo","mainMode":"Modo principal","chooseMainMode":"Elegir modo principal","noLists":"Añade primero una lista","open":"Abrir","close":"Cerrar","defaultListName":"Lista","defaultModeName":"Modo","defaultSubModeName":"Submodo","defaultSwitchName":"Encendido/apagado"}};
  let lang = 'en';
  let t = txt.en;
  function normalizeLanguage(value){
    const code = String(value || '').toLowerCase().split('-')[0];
    return ['nl','en','de','fr','es'].includes(code) ? code : 'en';
  }
  async function resolveHomeyLanguage(){
    try{
      const result = await emit('get_language', null);
      if(result) return normalizeLanguage(typeof result === 'string' ? result : result.language);
    }catch(e){}
    try{
      if(window.Homey && typeof Homey.getLanguage === 'function') return normalizeLanguage(await Homey.getLanguage());
    }catch(e){}
    return normalizeLanguage(navigator.language || 'en');
  }
  function applyTranslations(){
    t = txt[lang] || txt.en;
    t.title = isRepair ? t.titleRepair : t.titlePair;
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n] || el.textContent; });
  }

  let state = { name:'Mode & Switch', lists:[], switches:[] };
  let openListId = null;
  const $ = id => document.getElementById(id);
  const cleanId = v => String(v || '').trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'_').replace(/^_+|_+$/g,'');
  const makeId = (name, fallback) => cleanId(name) || `${fallback}_${Date.now()}_${Math.floor(Math.random()*999)}`;
  const emit = (name, data) => new Promise((resolve, reject) => {
    if (!window.Homey || !Homey.emit) return resolve(null);
    Homey.emit(name, data, (err, result) => err ? reject(err) : resolve(result));
  });
  const createDevice = device => new Promise((resolve, reject) => {
    if (!window.Homey || !Homey.createDevice) return resolve(null);
    Homey.createDevice(device, err => err ? reject(err) : resolve(true));
  });

  function esc(v){return String(v == null ? '' : v).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function setStatus(msg, cls){$('status').className = 'status ' + (cls || ''); $('status').textContent = msg || '';}
  function move(arr, index, dir){const ni=index+dir;if(ni<0||ni>=arr.length)return;const x=arr[index];arr[index]=arr[ni];arr[ni]=x;}
  function activeName(list){const btn=(list.buttons||[]).find(b=>b.id===list.activeId) || (list.buttons||[])[0]; return btn ? btn.name : '-';}

  function render(){
    $('deviceName').value = state.name || '';
    $('listsCount').textContent = `${state.lists.length}/${MAX_LISTS}`;
    $('switchesCount').textContent = `${state.switches.length}/${MAX_SWITCHES}`;
    $('counter').textContent = `${state.lists.length} ${t.listsTitle.toLowerCase()} · ${state.switches.length} ${t.switchesTitle.toLowerCase()}`;
    renderLists();
    renderSwitches();
  }

  function renderLists(){
    const box = $('lists');
    if (!state.lists.length) { box.innerHTML = `<div class="empty">${t.emptyLists}</div>`; return; }
    box.innerHTML = state.lists.map((list, i) => {
      const isOpen = openListId ? list.id === openListId : i === 0;
      const modeCount = (list.buttons||[]).length;
      return `
      <div class="list-card ${isOpen?'open':''}" data-list="${i}">
        <div class="list-summary">
          <div class="list-ico">☰</div>
          <div class="list-main">
            <div class="list-name-row"><input class="list-name" value="${esc(list.name)}" placeholder="${t.listName}"></div>
            <div class="meta">${modeCount} ${t.modes} · ${t.active}: <span class="active-text">${esc(activeName(list))}</span></div>
          </div>
          <button class="chev toggle-list" title="${isOpen?t.close:t.open}">${isOpen?'⌃':'⌄'}</button>
          <button class="danger mini remove del-list" title="${t.remove}">⌫</button>
        </div>
        <div class="list-body">
          <div class="modes">
          ${modeCount ? list.buttons.map((mode, mi) => {
            const mainOptions = (list.buttons||[]).filter((m, idx) => idx !== mi && !m.isSubMode);
            const parentSelect = `<select class="parent-mode" title="${t.mainMode}" ${mode.isSubMode ? '' : 'disabled'}>
              <option value="">${t.chooseMainMode}</option>
              ${mainOptions.map(m => `<option value="${esc(m.id)}" ${m.id===mode.parentModeId?'selected':''}>${esc(m.name)}</option>`).join('')}
            </select>`;
            return `
            <div class="mode-row" data-mode="${mi}">
              <button class="radio ${mode.id===list.activeId?'active':''}" data-set-active="${mi}" title="${t.active}"></button>
              <input class="mode-name" value="${esc(mode.name)}" placeholder="${t.modeName}">
              <button class="ghost mini sub-mode ${mode.isSubMode?'primary':''}" title="${t.subMode}">↳</button>
              <button class="ghost mini move up-mode" title="${t.up}">↑</button>
              <button class="ghost mini move down-mode" title="${t.down}">↓</button>
              <button class="danger mini remove del-mode" title="${t.remove}">⌫</button>
              <div style="grid-column:2 / -1;display:${mode.isSubMode?'block':'none'};margin:0 0 6px">${parentSelect}</div>
            </div>`;
          }).join('') : `<div class="empty">${t.emptyModes}</div>`}
          </div>
          <button class="add-inline add-mode">${t.addMode}</button>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px">
            <button class="ghost up-list">↑ ${t.up}</button>
            <button class="ghost down-list">↓ ${t.down}</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function renderSwitches(){
    const box = $('switches');
    if (!state.switches.length) { box.innerHTML = `<div class="empty">${t.emptySwitches}</div>`; return; }
    box.innerHTML = `<div class="switch-card">${state.switches.map((sw, i) => `
      <div class="switch-row" data-switch="${i}">
        <button class="toggle ${sw.on?'on':''}" data-toggle-switch title="${sw.on?t.on:t.off}"></button>
        <input class="switch-name" value="${esc(sw.name)}" placeholder="${t.switchName}">
        <button class="ghost mini move up-switch" title="${t.up}">↑</button>
        <button class="ghost mini move down-switch" title="${t.down}">↓</button>
        <button class="danger mini remove del-switch" title="${t.remove}">⌫</button>
      </div>`).join('')}</div>`;
  }

  function syncFromDom(){
    state.name = $('deviceName').value.trim();
    document.querySelectorAll('[data-list]').forEach(el => {
      const i = +el.dataset.list; const list = state.lists[i]; if(!list)return;
      const name = el.querySelector('.list-name'); if(name) list.name = name.value.trim();
      el.querySelectorAll('[data-mode]').forEach(mel => {
        const mi=+mel.dataset.mode; const input=mel.querySelector('.mode-name');
        if(list.buttons[mi] && input) {
          list.buttons[mi].name = input.value.trim();
          const parent = mel.querySelector('.parent-mode');
          if(parent) list.buttons[mi].parentModeId = parent.value || '';
        }
      });
    });
    document.querySelectorAll('[data-switch]').forEach(el => {
      const i=+el.dataset.switch; if(!state.switches[i])return;
      const name=el.querySelector('.switch-name'); if(name) state.switches[i].name = name.value.trim();
    });
  }

  function normalized(){
    syncFromDom();
    const lists = state.lists.map((l) => {
      const listId = l.id || makeId(l.name, 'list');
      const mainIds = new Set((l.buttons||[]).filter(m => !m.isSubMode).map(m => m.id));
      const buttons = (l.buttons||[]).map((m) => {
        const id = m.id || makeId(m.name, 'mode');
        const parentModeId = m.isSubMode && mainIds.has(m.parentModeId) && m.parentModeId !== id ? m.parentModeId : '';
        return { id, name: m.name.trim(), ...(parentModeId ? { isSubMode:true, parentModeId } : {}) };
      }).filter(m => m.name);
      const activeId = buttons.some(m => m.id === l.activeId) ? l.activeId : (buttons[0] && buttons[0].id) || null;
      return { id:listId, name:l.name.trim(), buttons, activeId };
    }).filter(l => l.name);
    const switches = state.switches.map((s) => ({ id:s.id || makeId(s.name, 'switch'), name:s.name.trim(), on:!!s.on })).filter(s => s.name);
    return { name:state.name.trim(), lists, switches };
  }
  function valid(conf){ return !!conf.name && conf.lists.every(l => l.name && l.buttons.every(m => m.name)) && conf.switches.every(s => s.name); }

  document.addEventListener('input', e => { if(e.target.matches('input,select')) syncFromDom(); });
  document.addEventListener('click', e => {
    syncFromDom();
    const listEl=e.target.closest('[data-list]');
    const swEl=e.target.closest('[data-switch]');

    if(e.target.id==='addList'){
      if(state.lists.length >= MAX_LISTS){setStatus(t.maxLists,'error');return;}
      const name=`${t.defaultListName} ${state.lists.length+1}`;
      const id=makeId(name,'list');
      state.lists.push({id,name,buttons:[],activeId:null});
      openListId=id; setStatus('', ''); render(); return;
    }
    if(e.target.id==='addSwitch'){
      if(state.switches.length >= MAX_SWITCHES){setStatus(t.maxSwitches,'error');return;}
      state.switches.push({id:null,name:`${t.defaultSwitchName} ${state.switches.length+1}`,on:false});
      setStatus('', ''); render(); return;
    }

    if(listEl){
      const i=+listEl.dataset.list; const list=state.lists[i]; if(!list)return;
      if(e.target.classList.contains('toggle-list')){openListId=(openListId===list.id)?null:list.id; render(); return;}
      if(e.target.classList.contains('del-list')){state.lists.splice(i,1); if(openListId===list.id) openListId=null; render(); return;}
      if(e.target.classList.contains('up-list')){move(state.lists,i,-1); render(); return;}
      if(e.target.classList.contains('down-list')){move(state.lists,i,1); render(); return;}
      if(e.target.classList.contains('add-mode')){const name=`${t.defaultModeName} ${list.buttons.length+1}`; const id=makeId(name,'mode'); list.buttons.push({id,name,isSubMode:false,parentModeId:''}); if(!list.activeId)list.activeId=id; openListId=list.id; render(); return;}
      const setActive=e.target.closest('[data-set-active]');
      if(setActive){const mi=+setActive.dataset.setActive; if(list.buttons[mi]){list.activeId=list.buttons[mi].id; openListId=list.id; render();} return;}
      const modeEl=e.target.closest('[data-mode]');
      if(modeEl){const mi=+modeEl.dataset.mode;
        if(e.target.classList.contains('sub-mode')){
          const mode=list.buttons[mi];
          if(mode){
            mode.isSubMode=!mode.isSubMode;
            if(mode.isSubMode){
              const parent=(list.buttons||[]).find((m,idx)=>idx!==mi && !m.isSubMode);
              mode.parentModeId=parent ? parent.id : '';
            } else {
              mode.parentModeId='';
              (list.buttons||[]).forEach(child=>{ if(child.parentModeId===mode.id){ child.isSubMode=false; child.parentModeId=''; } });
            }
            openListId=list.id; render();
          }
          return;
        }
        if(e.target.classList.contains('del-mode')){const removed=list.buttons.splice(mi,1)[0]; if(removed){ (list.buttons||[]).forEach(child=>{ if(child.parentModeId===removed.id){ child.isSubMode=false; child.parentModeId=''; } }); } if(removed && list.activeId===removed.id) list.activeId=(list.buttons[0]&&list.buttons[0].id)||null; openListId=list.id; render(); return;}
        if(e.target.classList.contains('up-mode')){move(list.buttons,mi,-1); openListId=list.id; render(); return;}
        if(e.target.classList.contains('down-mode')){move(list.buttons,mi,1); openListId=list.id; render(); return;}
      }
    }

    if(swEl){
      const i=+swEl.dataset.switch; if(!state.switches[i])return;
      if(e.target.closest('[data-toggle-switch]')){state.switches[i].on=!state.switches[i].on; render(); return;}
      if(e.target.classList.contains('del-switch')){state.switches.splice(i,1); render(); return;}
      if(e.target.classList.contains('up-switch')){move(state.switches,i,-1); render(); return;}
      if(e.target.classList.contains('down-switch')){move(state.switches,i,1); render(); return;}
    }
  });

  $('save').addEventListener('click', async () => {
    const conf = normalized();
    if(!conf.name){setStatus(t.nameRequired,'error');return;}
    if(!valid(conf)){setStatus(t.invalid,'error');return;}
    try{
      if(isRepair){ await emit('save_config', conf); setStatus(t.saved,'ok'); }
      else { const device = await emit('create_device', conf); await createDevice(device); setStatus(t.saved,'ok'); if(window.Homey && Homey.done) Homey.done(); }
    } catch(err){ setStatus(err && err.message ? err.message : String(err), 'error'); }
  });
  $('cancel').addEventListener('click', () => { if(window.Homey && Homey.done) Homey.done(); });

  async function init(){
    lang = await resolveHomeyLanguage();
    applyTranslations();
    try{
      const conf = await emit(isRepair ? 'get_config' : 'get_default_config', null);
      if(conf){ state = Object.assign(state, conf); }
    } catch(e){}
    if(state.lists && state.lists[0]) openListId = state.lists[0].id;
    render();
  }
  init();
})();
</script>
</body>
</html>
